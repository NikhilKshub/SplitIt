<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Karla:ital,wght@0,200..800;1,200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">   
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <article class="card">
            <header>
                <h1>SplitIt</h1>
                <p>Split your bill.</p>
            </header>

            <section id="bill-section">
                <h2>Bill</h2>
                <label for="bill">Bill amount</label>
                <input type="number" id="bill" placeholder="0">
            </section>

            <section id="tip-section">
                <h2>Tip</h2>
                <div class="tip-row">
                    <button class="tip-btn" data-tip="5">5%</button>
                    <button class="tip-btn" data-tip="10">10%</button>
                    <button class="tip-btn" data-tip="15">15%</button>
                </div>    
                    <label for="custom-tip">Or type your own tip</label>
                    <input type="number" id="custom-tip" placeholder="Custom %">
            </section>

            <section id="people-section">
                <h2>People</h2>
                <label for="people">Number of people</label>
                <div class="people-row">
                    <button id="minus">-</button>
                    <input type="number" id="people" value="1">
                    <button id="plus">+</button>
                </div>
            </section>

            <section id="result-section">
                <h2>Result</h2>
                <p>Tip: <span id="tip-amount">0.00</span></p>
                <p>Total: <span id="total-amount">0.00</span></p>
                <p class="final">Each person pays: <span id="per-person">0.00</span></p>
                <button id="reset">Reset</button>
            </section>

            <footer>
                <p><strong></strong></p>
                <!-- add a simple line type in footer -->
            </footer>
        </article>



    </main>












































    <script src="script.js"></script>
</body>
</html>
